[package]
name = "django-ty"
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
description = "Native regression oracle for Django Monty semantics"
license = "MIT"
repository = "https://github.com/regularkevvv/django-ty"
authors = ["Kevin Castro <hola@kev.pe>"]
readme = "README.md"
keywords = ["django", "ty", "typing", "plugins"]
categories = ["development-tools"]
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
ty_plugin_sdk = "0.0.8"
