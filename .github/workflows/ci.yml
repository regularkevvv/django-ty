name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          path: django-ty
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install Rust components
        run: rustup component add rustfmt clippy llvm-tools-preview && rustup target add wasm32-unknown-unknown
        working-directory: django-ty
      - name: Verify vendored Django compatibility map
        run: uv run --no-project --python 3.11 python scripts/evaluate_django_stubs_coverage.py --check
        working-directory: django-ty
      - name: Test compatibility tooling
        run: uv run --no-project --python 3.11 python -m unittest discover -s tests
        working-directory: django-ty
      - name: Verify differential conformance
        run: bash scripts/differential-conformance.sh --check
        working-directory: django-ty
      - name: Verify Django and Python compatibility matrix
        run: uv run --no-project --python 3.11 python scripts/probe_django_versions.py --check
        working-directory: django-ty
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --check
        working-directory: django-ty
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: django-ty
      - name: Run unit tests
        run: cargo test --locked
        working-directory: django-ty
      - name: Enforce line coverage
        run: cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 98
        working-directory: django-ty
      - name: Verify wheel installation
        run: bash scripts/e2e.sh
        working-directory: django-ty
      - name: Check Monty source and packaging
        working-directory: django-ty
        run: |
          python3 scripts/build-monty.py --check
          uv run --no-project --with ruff==0.16.10 ruff check --isolated --select E4,E7,E9,F,I python/django_ty/monty.py scripts/build-monty.py scripts/build-monty-wheel.py scripts/check_monty_parity.py scripts/benchmark_runtimes.py
          uv run --no-project --with ruff==0.16.10 ruff format --isolated --check python/django_ty/monty.py scripts/build-monty.py scripts/build-monty-wheel.py scripts/check_monty_parity.py scripts/benchmark_runtimes.py
      - name: Verify Python and Monty response parity
        run: bash scripts/check-monty-parity.sh
        working-directory: django-ty
      - name: Verify Monty official contracts
        run: DJANGO_TY_RUNTIME=monty bash scripts/differential-conformance.sh --check
        working-directory: django-ty
      - name: Verify Monty Django and Python matrix
        run: DJANGO_TY_RUNTIME=monty uv run --no-project --python 3.11 python scripts/probe_django_versions.py --check --reuse
        working-directory: django-ty
      - name: Verify Monty wheel installation
        run: DJANGO_TY_RUNTIME=monty bash scripts/e2e.sh
        working-directory: django-ty
