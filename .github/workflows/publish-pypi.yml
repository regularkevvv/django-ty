name: Publish django-ty to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Upload django-ty to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: django-ty
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Require successful main CI for this exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0].conclusion')"
          test "$conclusion" = success
      - name: Build wheel
        run: bash scripts/build-wheel.sh
        working-directory: django-ty
      - name: Verify the release wheel through installed CLI and LSP
        working-directory: django-ty
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/django-ty/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --no-project --python 3.13 --with "$wheel" python scripts/check_companion_install.py --output "$RUNNER_TEMP/django-ty-publish-smoke"
      - name: Attest the release distributions
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
        with:
          subject-path: django-ty/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: django-ty-published-distributions
          path: django-ty/dist/*
          retention-days: 5
      - name: Publish to PyPI
        run: uv publish dist/*
        working-directory: django-ty
