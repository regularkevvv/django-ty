# Probe matrix for the Django version compatibility table.
#
# Each row runs the differential conformance corpus twice: once with the
# version-appropriate reference oracle (mypy plus the django-stubs release
# paired with that Django line) and once with the django-ty candidate on
# ty-extended, which always evaluates against the vendored django-stubs 6.0.6
# static tree packaged in the wheel.
#
# `declared = true` means the Django version satisfies the wheel's
# `Django>=5.0,<6.1` dependency. Rows outside the range still run: the
# candidate wheel is installed with `--no-deps` so the probe measures what the
# plugin actually does there instead of what the resolver allows.
#
# django_stubs_commit pins the upstream release tag for provenance only; the
# probe installs the published django-stubs version, not a source checkout.

[matrix]
python = "3.13"
description = "Per-version differential conformance probes for the Django compatibility table"

[[matrix.probe]]
django = "5.0.14"
django_stubs = "5.0.4"
django_stubs_commit = "d60e31ed0ac4e4115f9ef20041521c201391d592"
declared = true
note = "Inside the declared range (EOL upstream)."

[[matrix.probe]]
django = "5.1.15"
django_stubs = "5.1.3"
django_stubs_commit = "7e50d7bdb16372ecb4a5d913748eba101082120b"
declared = true
note = "Inside the declared range (EOL upstream)."

[[matrix.probe]]
django = "5.2.17"
django_stubs = "5.2.9"
django_stubs_commit = "2825810e143a0377e3261fef658e1a59f7e0cf90"
declared = true
note = "Inside the declared range (5.2 LTS)."

[[matrix.probe]]
django = "6.0.7"
django_stubs = "6.0.6"
django_stubs_commit = "c1d968a356955f9598da6536115ccae4ed802b44"
mypy = "2.1.0"
declared = true
note = "CI-pinned conformance baseline; reproduces compatibility/differential-conformance.json."

[[matrix.probe]]
django = "6.1.1"
django_stubs = "6.1.1"
django_stubs_commit = "c7816bcf4cb8ec8706acb5b671ca62131b345ef7"
declared = false
note = "Above the declared `Django<6.1` ceiling; probed with --no-deps."
