"models.save-update-fields/save-valid-field" = { proof = "save-valid-field", expect = "pass", classification = "additional-literal-validation" }
"lookups.field-traversal/unknown-related-field" = { proof = "unknown-related-field", expect = "fail", classification = "implementation-defect-or-incomplete-validation", candidate_diagnostic = "django-ty.unknown-lookup" }
